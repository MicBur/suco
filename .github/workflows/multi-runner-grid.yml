name: Multi-Runner Distributed Grid Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  multi-runner-network-grid:
    name: Multi-Node Real Network Grid (Coordinator + 2 Linux Workers + Windows Client)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies & MinGW cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libzstd-dev g++-mingw-w64-x86-64

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build SUCO Binaries
        run: cmake --build build --config Release -j "$(nproc)"

      - name: Run Multi-Node Distributed Network Grid Test
        run: bash tests/multi_node_network_grid_test.sh "$GITHUB_WORKSPACE/build"
